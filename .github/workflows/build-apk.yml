name: Build Android APK

on:
  push:
    branches: [ master, fix-android-storage, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zipalign apksigner

      - name: Build and Patch Android APK
        run: |
          python3 tools/build_apk.py

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinjaGaidenBlack-android-arm64
          path: build/NinjaGaidenBlack-android-arm64.apk

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fix-android-storage'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.58-android-fix
          name: "Ninja Gaiden Black Recompiled v0.9.58 (Android Storage Fix)"
          body: |
            Fix for Android Scoped Storage error:
            `Cannot create the folder /storage/emulated/0/Android/data/io.github.gamboozino.ngbrecomp/files/game.partial: Not a directory (at /storage/emulated)`
          files: build/NinjaGaidenBlack-android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
